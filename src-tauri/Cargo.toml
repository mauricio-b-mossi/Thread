[package]
name = "thread"
version = "0.1.0"
description = "Thread desktop app"
authors = ["Thread"]
edition = "2021"

[lib]
name = "thread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
